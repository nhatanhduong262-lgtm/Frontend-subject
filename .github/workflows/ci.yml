name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run auth tests
        run: node --test server/auth.test.js

      - name: Run upload tests
        run: node --test server/uploadRules.test.js

      - name: Run route guard tests
        run: node --test server/routeGuard.test.js

      - name: Build Next.js app
        run: npm run build
